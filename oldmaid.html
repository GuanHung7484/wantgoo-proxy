<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a1060">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="抽鬼牌">
  <link rel="manifest" href="manifest.json">
  <title>抽鬼牌 — 小型遊樂場</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 標題列 -->
  <div class="game-header">
    <h1>👻 抽鬼牌</h1>
    <a href="index.html">← 回到大廳</a>
  </div>

  <!-- 設定畫面 -->
  <div class="setup-screen" id="setup-screen">
    <h2>遊戲設定</h2>

    <h3>選擇 AI 難度</h3>
    <div class="setup-grid" id="diff-grid">
      <button class="setup-btn beginner" data-level="beginner">
        <div class="sb-icon">😊</div>
        <div class="sb-name">初學者</div>
        <div class="sb-desc">完全隨機抽牌，毫無策略</div>
      </button>
      <button class="setup-btn intermediate" data-level="intermediate">
        <div class="sb-icon">🧐</div>
        <div class="sb-name">中級</div>
        <div class="sb-desc">30% 機率閃避鬼牌</div>
      </button>
      <button class="setup-btn advanced" data-level="advanced">
        <div class="sb-icon">😈</div>
        <div class="sb-name">高級</div>
        <div class="sb-desc">55% 機率閃避鬼牌</div>
      </button>
      <button class="setup-btn boss" data-level="boss">
        <div class="sb-icon">👹</div>
        <div class="sb-name">魔王級</div>
        <div class="sb-desc">80% 閃避鬼牌，還會虛張聲勢</div>
      </button>
    </div>

    <h3>選擇遊戲人數（含自己）</h3>
    <div class="count-grid" id="count-grid">
      <button class="setup-btn" data-count="2">
        <div class="sb-icon">👤</div>
        <div class="sb-name">2 人</div>
        <div class="sb-desc">你 + 香吉士</div>
      </button>
      <button class="setup-btn" data-count="3">
        <div class="sb-icon">👥</div>
        <div class="sb-name">3 人</div>
        <div class="sb-desc">你 + 香吉士 + 索隆</div>
      </button>
      <button class="setup-btn" data-count="4">
        <div class="sb-icon">👥</div>
        <div class="sb-name">4 人</div>
        <div class="sb-desc">你 + 香吉士 + 索隆 + 娜美</div>
      </button>
    </div>

    <button class="btn-start" id="btn-start-game" disabled>開始遊戲</button>
  </div>

  <!-- 遊戲桌面 -->
  <div class="game-table" id="game-table">
    <!-- 計分板 -->
    <div class="scoreboard">
      <strong>戰績</strong>
      <div class="scores" id="scoreboard-content"></div>
    </div>

    <!-- 四方向牌桌 -->
    <div class="om-table-wrap">

      <!-- 上方：索隆 (AI2) -->
      <div class="om-top" id="area-top"></div>

      <!-- 左方：娜美 (AI3) -->
      <div class="om-left" id="area-left"></div>

      <!-- 中央：訊息 -->
      <div class="om-center" id="area-center">
        <div class="turn-indicator" id="turn-indicator"></div>
        <div class="message" id="message"></div>
        <div class="action-bar" style="margin-top:8px">
          <button class="btn btn-new" id="btn-new" style="display:none">再來一局</button>
        </div>
      </div>

      <!-- 右方：香吉士 (AI1) -->
      <div class="om-right" id="area-right"></div>

      <!-- 下方：你 -->
      <div class="om-bottom" id="area-bottom"></div>

    </div>

    <div class="action-bar" style="margin-top:10px">
      <button class="btn btn-secondary" id="btn-back">更換設定</button>
    </div>
  </div>

  <script src="js/oldmaid.js"></script>
</body>
</html>
