<body><main class="game"><canvas id="scene"></canvas>
<header class="top"><a class="back" href="index.html">← 返回大廳</a><div class="title"><b>天才小釣手</b><small>MASTER ANGLER</small></div><div class="stats"><span class="chip">紀錄 <b id="record">0</b> kg</span><span class="chip">漁獲 <b id="caughtCount">0</b></span></div></header>

<div class="controls"><button class="action" id="mainBtn">按住蓄力</button><button class="action secondary" id="reelBtn" disabled>捲線／拉竿</button></div><div class="flash" id="flash"><b id="flashText">魚上鉤了！</b></div>
<section class="modal" id="intro"><div class="card"><div class="kicker">THIRD PERSON FISHING</div><h1>天才小釣手</h1><p>第三人稱動漫風拉竿。掌握拋竿力道，在浮標劇動時迅速拉竿；搏鬥時用按、放節奏把張力維持在安全區。</p><div class="rules"><div>① 按住再放開<br><b>控制拋竿</b></div><div>② 咬鉤時點擊<br><b>迅速拉竿</b></div><div>③ 按放捲線<br><b>控制張力</b></div></div><button id="startBtn">開始釣魚</button></div></section>
<section class="modal hidden" id="result"><div class="card"><div class="kicker" id="resultKicker">GREAT CATCH</div><div class="catch-fish" id="fishEmoji">🐟</div><h1 id="resultTitle">成功釣起！</h1><p id="resultInfo"></p><button id="againBtn">再釣一次</button><a href="index.html">回到遊戲大廳</a></div></section>
</main><script>
(()=>{"use strict";const $=s=>document.querySelector(s),canvas=$("#scene"),ctx=canvas.getContext("2d"),bg=new Image;bg.src="assets/genius-fisher-lagoon.png";let W=0,H=0,D=1,last=0,audio=null;
// 狀態機：每個階段只允許自己的輸入與更新邏輯，避免流程互相干擾。
const STATES={READY:"ready",CHARGING:"charging",CASTING:"casting",WAITING:"waiting",BITE:"bite",FIGHTING:"fighting",CAUGHT:"caught",FAILED:"failed"};
const FISH=[{name:"紅鯛",emoji:"🐟",power:.82,min:48,max:78,kg:.032,color:"#e85b45"},{name:"金目鱸",emoji:"🐠",power:.68,min:35,max:66,kg:.026,color:"#e2bd43"},{name:"巨型石斑",emoji:"🐡",power:1.08,min:62,max:112,kg:.048,color:"#697b58"},{name:"銀鱗鮪魚",emoji:"🐟",power:.96,min:55,max:98,kg:.041,color:"#5d91aa"}];
class TensionSystem{constructor(){this.reset()}reset(){this.value=38;this.redTime=0;this.zeroTime=0}update(dt,reeling,fishPower,burst){let target=(reeling?34:-22)+fishPower*22+(burst?42:0);this.value+=target*dt;this.value=Math.max(0,Math.min(100,this.value));this.redTime=this.value>88?this.redTime+dt:Math.max(0,this.redTime-dt*1.8);this.zeroTime=this.value<3?this.zeroTime+dt:Math.max(0,this.zeroTime-dt*2);return this.redTime>1.25?"broken":this.zeroTime>1.45?"loose":null}get safe(){return this.value>=12&&this.value<=82}}
class FishFighter{constructor(){this.reset(null)}reset(fish){this.fish=fish;this.stamina=100;this.phase=0;this.burst=false;this.burstLeft=0}update(dt,reeling,tension){this.phase+=dt;if(this.burstLeft<=0&&Math.random()<dt*(.48+this.fish.power*.22)){this.burst=true;this.burstLeft=.55+Math.random()*.75}this.burstLeft-=dt;if(this.burstLeft<=0)this.burst=false;// 只有捲線且張力在黃綠安全帶內，才有效消耗魚的體力。
if(reeling&&tension.safe)this.stamina-=dt*(7.8-this.fish.power*1.8);return this.stamina<=0}}
class GameStateMachine{constructor(){this.state=STATES.READY;this.elapsed=0;this.power=0;this.powerDir=1;this.castT=0;this.waitFor=0;this.biteWindow=0;this.reeling=false;this.fish=null;this.tension=new TensionSystem;this.fighter=new FishFighter;this.aimX=.62;this.target={x:.62,y:.52};this.signal=0;this.nextFish=null;this.zones=[{x:.35,y:.58,fish:1},{x:.52,y:.43,fish:0},{x:.69,y:.52,fish:2},{x:.79,y:.37,fish:3}];this.bobber={x:.485,y:.245,splash:0};this.catches=0;this.record=0}
set(next){this.state=next;this.elapsed=0;this.reeling=false;updateUI();if(next===STATES.WAITING){this.signal=this.getSignal(this.target);this.waitFor=1.8+(1-this.signal)*5+Math.random()*1.5;let nearest=this.nearestZone(this.target);this.nextFish=FISH[nearest.fish];mission(this.signal>.7?"魚群訊號很強，準備拉竿！":this.signal>.38?"偵測到魚訊，注意浮標…":"這區魚訊較弱，耐心等待…")}if(next===STATES.BITE){this.biteWindow=1.65;this.bobber.splash=1;flash("魚上鉤了！快拉竿");tone(880,.12);setTimeout(()=>tone(1100,.1),100)}if(next===STATES.FIGHTING){this.fish=this.nextFish||FISH[Math.random()*FISH.length|0];this.tension.reset();this.fighter.reset(this.fish);mission("按住捲線，放開降張力・維持黃綠區");tone(520,.12)}if(next===STATES.READY)mission("在水面左右移動瞄準，再按住蓄力決定遠近")}
nearestZone(p){return this.zones.reduce((best,z)=>Math.hypot(z.x-p.x,z.y-p.y)<Math.hypot(best.x-p.x,best.y-p.y)?z:best,this.zones[0])}getSignal(p){let z=this.nearestZone(p);return Math.max(0,1-Math.hypot(z.x-p.x,z.y-p.y)*4.2)}setAim(clientX){if(![STATES.READY,STATES.CHARGING].includes(this.state))return;let r=canvas.getBoundingClientRect();this.aimX=Math.max(.28,Math.min(.84,(clientX-r.left)/r.width));updateRadar()}
pressMain(){if(this.state===STATES.READY){this.power=0;this.powerDir=1;this.set(STATES.CHARGING)}}releaseMain(){if(this.state===STATES.CHARGING){this.castT=0;this.target={x:this.aimX,y:.7-this.power*.0035};this.bobber={x:.485,y:.245,splash:0};this.set(STATES.CASTING);tone(650,.08)}}pressReel(){if(this.state===STATES.BITE){this.set(STATES.FIGHTING);this.reeling=true;startReelSound()}else if(this.state===STATES.FIGHTING){this.reeling=true;startReelSound()}}releaseReel(){this.reeling=false;stopReelSound()}
update(dt){this.elapsed+=dt;if(this.state===STATES.CHARGING){this.power+=this.powerDir*dt*72;if(this.power>=100){this.power=100;this.powerDir=-1}if(this.power<=18)this.powerDir=1}else if(this.state===STATES.CASTING){this.castT+=dt;let t=Math.min(1,this.castT/1.05);this.bobber.x=.485+(this.target.x-.485)*t;this.bobber.y=.245+(this.target.y-.245)*t-Math.sin(t*Math.PI)*.34;if(t>=1){this.bobber.x=this.target.x;this.bobber.y=this.target.y;this.set(STATES.WAITING)}}else if(this.state===STATES.WAITING){if(this.elapsed>=this.waitFor)this.set(STATES.BITE)}else if(this.state===STATES.BITE){this.biteWindow-=dt;this.bobber.splash=Math.max(0,this.bobber.splash-dt*.7);if(this.biteWindow<=0)this.fail("反應太慢，魚吃完餌逃走了") }else if(this.state===STATES.FIGHTING){let done=this.fighter.update(dt,this.reeling,this.tension),bad=this.tension.update(dt,this.reeling,this.fish.power,this.fighter.burst);if(bad)this.fail(bad==="broken"?"張力過高，魚線斷裂！":"張力歸零，魚脫鉤了！");else if(done)this.catchFish()}updateUI()}
catchFish(){this.set(STATES.CAUGHT);stopReelSound();playCatchSound();let length=Math.round(this.fish.min+Math.random()*(this.fish.max-this.fish.min)),weight=+(length*this.fish.kg*(.8+Math.random()*.4)).toFixed(2);this.catches++;this.record=Math.max(this.record,weight);$("#caughtCount").textContent=this.catches;$("#record").textContent=this.record.toFixed(2);showResult(true,`${this.fish.name}｜${length} 公分｜${weight} 公斤`,this.fish.emoji);tone(880,.12);setTimeout(()=>tone(1180,.2),130)}fail(reason){stopReelSound();this.set(STATES.FAILED);showResult(false,reason,"💨")}}
const game=new GameStateMachine;
let soundEnabled=true;const oceanAudio=$("#oceanAudio"),reelAudio=$("#reelAudio"),catchAudio=$("#catchAudio");
function applyVolume(){let v=Number($("#volume").value)/100;oceanAudio.volume=v*.7;reelAudio.volume=Math.min(1,v*.9);catchAudio.volume=v}
function startAmbient(){if(!soundEnabled)return;oceanAudio.play().catch(()=>{})}
function startReelSound(){if(!soundEnabled)return;reelAudio.currentTime=0;reelAudio.play().catch(()=>{})}
function stopReelSound(){reelAudio.pause();reelAudio.currentTime=0}
function playCatchSound(){if(!soundEnabled)return;catchAudio.currentTime=0;catchAudio.play().catch(()=>{})}
function toggleSound(){soundEnabled=!soundEnabled;$("#soundToggle").textContent=soundEnabled?"🔊 海浪音效":"🔇 音效關閉";if(soundEnabled)startAmbient();else{oceanAudio.pause();stopReelSound();catchAudio.pause()}}
function initRadar(){let screen=$("#radarScreen");game.zones.forEach((z,i)=>{let dot=document.createElement("i");dot.className="radar-dot";dot.style.left=(z.x*100)+"%";dot.style.top=((z.y-.28)/.5*100)+"%";dot.title=FISH[z.fish].name;screen.appendChild(dot)});updateRadar()}
function updateRadar(){let deg=-70+(game.aimX-.28)/.56*140;$("#radarAim").style.transform=`rotate(${deg}deg)`;let preview={x:game.aimX,y:.7-game.power*.0035},signal=game.getSignal(preview);$("#signal").textContent=signal>.7?"強烈魚訊":signal>.38?"偵測到魚群":"訊號微弱";$("#signal").style.color=signal>.7?"#76ff91":signal>.38?"#ffd945":"#9bcbd4"}
function mission(t){$("#mission").innerHTML=t.replace(/(黃綠區|快拉竿|蓄力)/g,"<strong>$1</strong>")}
function updateUI(){let s=game.state,fight=s===STATES.FIGHTING;$("#tensionUI").classList.toggle("active",fight);$("#power").classList.toggle("show",s===STATES.CHARGING);$("#powerFill").style.width=game.power+"%";$("#tensionFill").style.width=game.tension.value+"%";$("#needle").style.left=`calc(${game.tension.value}% - 2px)`;$("#tensionText").textContent=Math.round(game.tension.value)+"%";$("#staminaFill").style.width=(game.fighter.stamina||100)+"%";let m=$("#mainBtn"),r=$("#reelBtn");m.disabled=![STATES.READY,STATES.CHARGING].includes(s);m.textContent=s===STATES.CHARGING?"放開拋竿":"按住蓄力";r.disabled=![STATES.BITE,STATES.FIGHTING].includes(s);r.textContent=s===STATES.BITE?"立刻拉竿！":fight?"按住捲線":"捲線／拉竿";r.classList.toggle("pressed",game.reeling);if($("#radarAim"))updateRadar()}
function showResult(ok,info,emoji){$("#resultKicker").textContent=ok?"GREAT CATCH":"FISH ESCAPED";$("#resultTitle").textContent=ok?"成功釣起！":"魚逃走了";$("#resultInfo").textContent=info;$("#fishEmoji").textContent=emoji;setTimeout(()=>$("#result").classList.remove("hidden"),ok?1050:350)}function flash(t){$("#flashText").textContent=t;$("#flash").classList.add("show");setTimeout(()=>$("#flash").classList.remove("show"),650)}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0)}
function draw(now){let horizon=H*.34;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,"#59cfe9");sky.addColorStop(1,"#d7f5e9");ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle="#486e4e";for(let q=-60;q<W+80;q+=95){let h=45+(q*7%55);ctx.beginPath();ctx.moveTo(q,horizon);ctx.lineTo(q+55,horizon-h);ctx.lineTo(q+115,horizon);ctx.fill()}ctx.fillStyle="#ddd6ad";ctx.beginPath();ctx.moveTo(0,horizon);for(let q=0;q<=W;q+=80)ctx.lineTo(q,horizon-8-Math.sin(q*.021)*18);ctx.lineTo(W,horizon+22);ctx.lineTo(0,horizon+18);ctx.fill();let sea=ctx.createLinearGradient(0,horizon,0,H);sea.addColorStop(0,"#168dbe");sea.addColorStop(1,"#03476d");ctx.fillStyle=sea;ctx.fillRect(0,horizon,W,H-horizon);ctx.strokeStyle="#b9fbff33";ctx.lineWidth=1;for(let j=0;j<28;j++){let y=horizon+j*j*.55+8,amp=2+j*.12;ctx.beginPath();for(let q=0;q<W;q+=18){let yy=y+Math.sin(q*.022+now*.0018+j)*amp;q?ctx.lineTo(q,yy):ctx.moveTo(q,yy)}ctx.stroke()}drawBobber(now);drawRod(now)}
function drawBobber(now){if([STATES.READY,STATES.CHARGING].includes(game.state))return;let bx=game.bobber.x*W,by=game.bobber.y*H;if(game.state===STATES.WAITING)by+=Math.sin(now*.004)*3;if(game.state===STATES.BITE)by+=Math.sin(now*.035)*14;ctx.strokeStyle="#eafcffb8";ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(W*.61,H*.76);ctx.quadraticCurveTo(W*.58,H*.3,bx,by);ctx.stroke();if(game.bobber.splash>0||game.state===STATES.BITE){ctx.strokeStyle="#d9ffff";for(let i=0;i<4;i++){let r=10+i*10+Math.sin(now*.01+i)*5;ctx.beginPath();ctx.ellipse(bx,by+8,r,r*.28,0,0,7);ctx.stroke()}}ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(bx,by,5,15,0,0,7);ctx.fill();ctx.fillStyle="#ef433c";ctx.fillRect(bx-5,by-14,10,13)}
function drawRod(now){let fight=game.state===STATES.FIGHTING,bend=fight?(game.tension.value/100)*48:0;ctx.save();ctx.translate(W*.55,H*.88);ctx.rotate(-.22+(fight?Math.sin(now*.012)*.015:0));let g=ctx.createLinearGradient(0,0,220,-330);g.addColorStop(0,"#17191a");g.addColorStop(.55,"#49301e");g.addColorStop(1,"#161718");ctx.strokeStyle=g;ctx.lineWidth=15;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(0,50);ctx.quadraticCurveTo(80,-130,185-bend,-350);ctx.stroke();ctx.strokeStyle="#111";ctx.lineWidth=3;for(let i=0;i<5;i++){let t=i/5,px=50+t*110,py=-70-t*230;ctx.beginPath();ctx.arc(px-bend*t,py,12-t*5,0,7);ctx.stroke()}ctx.fillStyle="#202427";ctx.beginPath();ctx.ellipse(35,-15,48,35,-.2,0,7);ctx.fill();ctx.strokeStyle="#e0a329";ctx.lineWidth=7;ctx.beginPath();ctx.arc(35,-15,28,0,7);ctx.stroke();ctx.strokeStyle="#17191a";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(60,2);ctx.lineTo(100,35);ctx.lineTo(115,25);ctx.stroke();ctx.restore();if(fight&&game.fighter.burst){ctx.fillStyle="#d9ffff99";for(let i=0;i<12;i++){let a=i*.9+now*.01,r=20+(i%4)*8,px=W*.5+Math.cos(a)*r,py=H*.48+Math.sin(a)*r*.4;ctx.beginPath();ctx.arc(px,py,2+i%3,0,7);ctx.fill()}}if(game.state===STATES.CAUGHT){let t=Math.min(1,game.elapsed/1.05),fy=H*.62-Math.sin(t*Math.PI)*H*.42,fx=W*.5+Math.sin(t*5)*35;ctx.fillStyle=game.fish.color;ctx.save();ctx.translate(fx,fy);ctx.rotate(-.5+t);ctx.beginPath();ctx.ellipse(0,0,48,21,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-42,0);ctx.lineTo(-72,-28);ctx.lineTo(-67,0);ctx.lineTo(-72,28);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(28,-5,5,0,7);ctx.fill();ctx.restore()}}
// 原創 3D 動漫場景作為底圖，互動魚線、浮標、水花與漁獲仍由 Canvas 即時繪製。
function drawPolished(now){if(!bg.complete||!bg.naturalWidth){draw(now);return}let scale=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),dw=bg.naturalWidth*scale,dh=bg.naturalHeight*scale;ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);let shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,"#00182a20");shade.addColorStop(.7,"#00182a00");shade.addColorStop(1,"#00182a45");ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);drawAimOverlay();drawPolishedBobber(now);if(game.state===STATES.CAUGHT)drawPolishedCatch()}
function drawAimOverlay(){if(![STATES.READY,STATES.CHARGING].includes(game.state))return;let tx=game.aimX*W,ty=(.7-game.power*.0035)*H,dist=Math.round(8+game.power*.34);ctx.save();ctx.strokeStyle="#7cf7ff";ctx.fillStyle="#7cf7ff";ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(W*.485,H*.245);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.ellipse(tx,ty,24,9,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(tx-7,ty);ctx.lineTo(tx+7,ty);ctx.moveTo(tx,ty-7);ctx.lineTo(tx,ty+7);ctx.stroke();ctx.font="900 13px Microsoft JhengHei";ctx.textAlign="center";ctx.fillText(`${dist} m`,tx,ty-15);ctx.restore()}
function drawPolishedBobber(now){if([STATES.READY,STATES.CHARGING].includes(game.state))return;let bx=game.bobber.x*W,by=game.bobber.y*H;if(game.state===STATES.WAITING)by+=Math.sin(now*.004)*3;if(game.state===STATES.BITE)by+=Math.sin(now*.035)*14;let tipX=W*.485,tipY=H*.245;ctx.strokeStyle=game.tension.value>82&&game.state===STATES.FIGHTING?"#ffd2a0":"#efffff";ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.quadraticCurveTo(W*(.52+(game.state===STATES.FIGHTING?game.tension.value*.0008:0)),H*.31,bx,by);ctx.stroke();if(game.bobber.splash>0||game.state===STATES.BITE||game.fighter.burst&&game.state===STATES.FIGHTING){ctx.strokeStyle="#efffff";ctx.lineWidth=2;for(let i=0;i<6;i++){let r=10+i*11+Math.sin(now*.01+i)*5;ctx.beginPath();ctx.ellipse(bx,by+8,r,r*.27,0,0,7);ctx.stroke()}ctx.fillStyle="#eaffffcc";for(let i=0;i<14;i++){let a=i*.91+now*.012,r=12+(i%5)*10;ctx.beginPath();ctx.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r*.38,2+i%3,0,7);ctx.fill()}}ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(bx,by,6,17,0,0,7);ctx.fill();ctx.fillStyle="#f0443d";ctx.fillRect(bx-6,by-16,12,14)}
function drawPolishedCatch(){let t=Math.min(1,game.elapsed/1.05),fy=H*.64-Math.sin(t*Math.PI)*H*.47,fx=W*.59+Math.sin(t*5)*35;ctx.save();ctx.translate(fx,fy);ctx.rotate(-.55+t);ctx.fillStyle=game.fish.color;ctx.shadowColor="#fff";ctx.shadowBlur=14;ctx.beginPath();ctx.ellipse(0,0,58,25,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-49,0);ctx.lineTo(-82,-32);ctx.lineTo(-74,0);ctx.lineTo(-82,32);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(34,-6,5,0,7);ctx.fill();ctx.fillStyle="#162733";ctx.beginPath();ctx.arc(36,-6,2.5,0,7);ctx.fill();ctx.restore();ctx.strokeStyle="#f5ffff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.485,H*.245);ctx.lineTo(fx,fy-20);ctx.stroke()}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(!$("#intro").classList.contains("hidden")||!$("#result").classList.contains("hidden")){}else game.update(dt);drawPolished(now);requestAnimationFrame(loop)}
function tone(f=440,d=.06){if(!soundEnabled)return;try{audio||=new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function bindHold(el,down,up){el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);down()});["pointerup","pointercancel","pointerleave"].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();up()}))}canvas.addEventListener("pointermove",e=>game.setAim(e.clientX));canvas.addEventListener("pointerdown",e=>game.setAim(e.clientX));bindHold($("#mainBtn"),()=>game.pressMain(),()=>game.releaseMain());bindHold($("#reelBtn"),()=>game.pressReel(),()=>game.releaseReel());addEventListener("keydown",e=>{if(e.repeat)return;if(e.code==="Space"){e.preventDefault();game.state===STATES.READY?game.pressMain():game.pressReel()}if(["ArrowLeft","ArrowRight"].includes(e.code)){game.aimX=Math.max(.28,Math.min(.84,game.aimX+(e.code==="ArrowLeft"?-.035:.035)));updateRadar()}});addEventListener("keyup",e=>{if(e.code==="Space"){game.releaseMain();game.releaseReel()}});$("#soundToggle").onclick=toggleSound;$("#volume").oninput=applyVolume;$("#startBtn").onclick=()=>{$("#intro").classList.add("hidden");game.set(STATES.READY);applyVolume();startAmbient();tone()};$("#againBtn").onclick=()=>{$("#result").classList.add("hidden");game.set(STATES.READY);startAmbient()};document.addEventListener("visibilitychange",()=>{if(document.hidden){oceanAudio.pause();stopReelSound()}else if(soundEnabled&&!$("#intro").classList.contains("hidden")){}else startAmbient()});addEventListener("resize",resize);resize();applyVolume();initRadar();updateUI();requestAnimationFrame(loop);
})();
</script></body></html>
