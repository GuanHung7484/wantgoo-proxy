<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天才小釣手｜遊戲室 Online</title>
<style>
:root{--gold:#ffd84a;--cyan:#53e7ff;--navy:#041e35}*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#062d48;color:#fff;font-family:"Microsoft JhengHei",system-ui,sans-serif;user-select:none}button,a{font:inherit}.game,canvas{width:100%;height:100%}.game{position:relative;min-height:520px;overflow:hidden}canvas{display:block;touch-action:none}.top{position:absolute;z-index:5;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:12px;background:linear-gradient(#031a2bdf,transparent);pointer-events:none}.back{justify-self:start;pointer-events:auto;padding:9px 13px;border:1px solid #ffffff55;border-radius:10px;background:#052b45d9;color:#fff;text-decoration:none;font-weight:900}.title{text-align:center;text-shadow:0 3px #087da2}.title b{display:block;font-size:clamp(20px,3vw,34px);font-style:italic}.title small{color:var(--gold);letter-spacing:3px}.stats{justify-self:end;display:flex;gap:6px}.chip{padding:8px 11px;border:1px solid #ffffff44;border-radius:99px;background:#052b45d9;font-size:12px;font-weight:800}.tension-wrap{position:absolute;z-index:6;top:72px;left:50%;transform:translateX(-50%);width:min(540px,70vw);text-align:center;opacity:.5;transition:.2s}.tension-wrap.active{opacity:1}.tension-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;font-weight:900;text-shadow:0 2px #000}.bar{position:relative;height:20px;padding:3px;border:2px solid white;border-radius:99px;background:#031a2bdd;box-shadow:0 3px 12px #0008}.zones{position:absolute;inset:3px;border-radius:99px;background:linear-gradient(90deg,#e54b42 0 8%,#4ad46d 8% 58%,#f3d249 58% 82%,#eb4c43 82%)}.fill{position:absolute;z-index:2;inset:3px auto 3px 3px;width:0;border-radius:99px;background:#fff9;box-shadow:0 0 8px white;transition:width .05s}.needle{position:absolute;z-index:3;top:-5px;left:0;width:4px;height:27px;border-radius:3px;background:#fff;box-shadow:0 0 9px #fff}.stamina{margin:6px auto 0;width:65%;height:9px;border:1px solid #fff8;border-radius:99px;background:#001827aa;overflow:hidden}.stamina i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff6b54,#ffd34c);transition:width .1s}.mission{position:absolute;z-index:6;top:118px;left:50%;transform:translateX(-50%);min-width:260px;padding:9px 18px;border:1px solid #7fecff55;border-radius:99px;background:#031c2ec7;text-align:center;font-weight:900;text-shadow:0 2px #000;pointer-events:none}.mission strong{color:var(--gold)}.controls{position:absolute;z-index:7;left:50%;bottom:22px;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(560px,92vw)}.action{min-height:62px;border:2px solid white;border-radius:17px;background:linear-gradient(#ffe75d,#ff9a08);color:#432600;box-shadow:0 6px #9d4b00;font-size:20px;font-weight:1000;touch-action:none}.action.secondary{background:linear-gradient(#55eaff,#078ac6);color:#04263b;box-shadow:0 6px #045a83}.action:active,.action.pressed{transform:translateY(4px);box-shadow:0 2px #633000}.action:disabled{filter:grayscale(.8);opacity:.5}.power{position:absolute;z-index:6;left:50%;bottom:104px;transform:translateX(-50%);width:min(420px,75vw);opacity:0;transition:.2s}.power.show{opacity:1}.power .bar{height:18px}.power-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4ddc6a,#ffe14b,#f04d43)}.flash{position:absolute;z-index:8;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;background:#fff2;transition:.15s}.flash.show{opacity:1}.flash b{font-size:clamp(36px,8vw,88px);font-style:italic;text-shadow:0 6px #006d92,0 0 25px #fff}.modal{position:absolute;z-index:12;inset:0;display:grid;place-items:center;padding:18px;background:#001625b8;backdrop-filter:blur(8px)}.modal.hidden{display:none}.card{width:min(560px,94vw);padding:28px;border:2px solid var(--cyan);border-radius:24px;background:linear-gradient(145deg,#075376,#031c32);box-shadow:0 25px 80px #000a;text-align:center}.card .kicker{color:var(--gold);font-weight:900;letter-spacing:4px}.card h1{margin:7px;font-size:clamp(36px,7vw,66px);font-style:italic;text-shadow:0 4px #067da4}.card p{color:#c6e9f1;line-height:1.7}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.rules div{padding:10px 5px;border-radius:10px;background:#fff1;font-size:12px}.card button,.card a{display:grid;place-items:center;width:100%;min-height:50px;margin-top:9px;border:0;border-radius:12px;background:linear-gradient(#ffe85b,#ff9900);color:#422600;text-decoration:none;font-size:18px;font-weight:1000}.card a{background:#096c94;color:#fff;border:1px solid #68ecff}.catch-fish{font-size:70px;animation:jump .75s ease-in-out infinite alternate}@keyframes jump{to{transform:translateY(-16px) rotate(8deg)}}@media(max-width:650px){.top{padding:7px}.back{padding:7px;font-size:11px}.title b{font-size:18px}.title small{display:none}.stats{display:none}.tension-wrap{top:53px;width:88vw}.mission{top:101px;min-width:210px;padding:7px;font-size:12px}.controls{bottom:13px;gap:8px}.action{min-height:53px;font-size:16px}.power{bottom:80px}.rules{grid-template-columns:1fr}.card{padding:20px}.catch-fish{font-size:52px}}
</style>
</head>
<body><main class="game"><canvas id="scene"></canvas>
<header class="top"><a class="back" href="index.html">← 返回大廳</a><div class="title"><b>天才小釣手</b><small>MASTER ANGLER</small></div><div class="stats"><span class="chip">紀錄 <b id="record">0</b> kg</span><span class="chip">漁獲 <b id="caughtCount">0</b></span></div></header>
<section class="tension-wrap" id="tensionUI"><div class="tension-label"><span>魚線張力 TENSION</span><span id="tensionText">0%</span></div><div class="bar"><div class="zones"></div><div class="fill" id="tensionFill"></div><div class="needle" id="needle"></div></div><div class="stamina"><i id="staminaFill"></i></div></section>
<div class="mission" id="mission">按住「蓄力」準備拋竿</div><div class="power" id="power"><div class="bar"><div class="power-fill" id="powerFill"></div></div></div>
<div class="controls"><button class="action" id="mainBtn">按住蓄力</button><button class="action secondary" id="reelBtn" disabled>捲線／拉竿</button></div><div class="flash" id="flash"><b id="flashText">魚上鉤了！</b></div>
<section class="modal" id="intro"><div class="card"><div class="kicker">FIRST PERSON FISHING</div><h1>天才小釣手</h1><p>第一人稱擬真拉竿。掌握拋竿力道，在浮標劇動時迅速拉竿；搏鬥時用按、放節奏把張力維持在安全區。</p><div class="rules"><div>① 按住再放開<br><b>控制拋竿</b></div><div>② 咬鉤時點擊<br><b>迅速拉竿</b></div><div>③ 按放捲線<br><b>控制張力</b></div></div><button id="startBtn">開始釣魚</button></div></section>
<section class="modal hidden" id="result"><div class="card"><div class="kicker" id="resultKicker">GREAT CATCH</div><div class="catch-fish" id="fishEmoji">🐟</div><h1 id="resultTitle">成功釣起！</h1><p id="resultInfo"></p><button id="againBtn">再釣一次</button><a href="index.html">回到遊戲大廳</a></div></section>
</main><script>
(()=>{"use strict";const $=s=>document.querySelector(s),canvas=$("#scene"),ctx=canvas.getContext("2d");let W=0,H=0,D=1,last=0,audio=null;
// 狀態機：每個階段只允許自己的輸入與更新邏輯，避免流程互相干擾。
const STATES={READY:"ready",CHARGING:"charging",CASTING:"casting",WAITING:"waiting",BITE:"bite",FIGHTING:"fighting",CAUGHT:"caught",FAILED:"failed"};
const FISH=[{name:"紅鯛",emoji:"🐟",power:.82,min:48,max:78,kg:.032,color:"#e85b45"},{name:"金目鱸",emoji:"🐠",power:.68,min:35,max:66,kg:.026,color:"#e2bd43"},{name:"巨型石斑",emoji:"🐡",power:1.08,min:62,max:112,kg:.048,color:"#697b58"},{name:"銀鱗鮪魚",emoji:"🐟",power:.96,min:55,max:98,kg:.041,color:"#5d91aa"}];
class TensionSystem{constructor(){this.reset()}reset(){this.value=38;this.redTime=0;this.zeroTime=0}update(dt,reeling,fishPower,burst){let target=(reeling?34:-22)+fishPower*22+(burst?42:0);this.value+=target*dt;this.value=Math.max(0,Math.min(100,this.value));this.redTime=this.value>88?this.redTime+dt:Math.max(0,this.redTime-dt*1.8);this.zeroTime=this.value<3?this.zeroTime+dt:Math.max(0,this.zeroTime-dt*2);return this.redTime>1.25?"broken":this.zeroTime>1.45?"loose":null}get safe(){return this.value>=12&&this.value<=82}}
class FishFighter{constructor(){this.reset(null)}reset(fish){this.fish=fish;this.stamina=100;this.phase=0;this.burst=false;this.burstLeft=0}update(dt,reeling,tension){this.phase+=dt;if(this.burstLeft<=0&&Math.random()<dt*(.48+this.fish.power*.22)){this.burst=true;this.burstLeft=.55+Math.random()*.75}this.burstLeft-=dt;if(this.burstLeft<=0)this.burst=false;// 只有捲線且張力在黃綠安全帶內，才有效消耗魚的體力。
if(reeling&&tension.safe)this.stamina-=dt*(7.8-this.fish.power*1.8);return this.stamina<=0}}
class GameStateMachine{constructor(){this.state=STATES.READY;this.elapsed=0;this.power=0;this.powerDir=1;this.castT=0;this.waitFor=0;this.biteWindow=0;this.reeling=false;this.fish=null;this.tension=new TensionSystem;this.fighter=new FishFighter;this.bobber={x:.5,y:.54,splash:0};this.catches=0;this.record=0}
set(next){this.state=next;this.elapsed=0;this.reeling=false;updateUI();if(next===STATES.WAITING){this.waitFor=2.5+Math.random()*4;mission("浮標已落水，仔細等待魚訊…")}if(next===STATES.BITE){this.biteWindow=1.65;this.bobber.splash=1;flash("魚上鉤了！快拉竿");tone(880,.12);setTimeout(()=>tone(1100,.1),100)}if(next===STATES.FIGHTING){this.fish=FISH[Math.random()*FISH.length|0];this.tension.reset();this.fighter.reset(this.fish);mission("按住捲線，放開降張力・維持黃綠區");tone(520,.12)}if(next===STATES.READY)mission("按住「蓄力」準備拋竿")}
pressMain(){if(this.state===STATES.READY){this.power=0;this.powerDir=1;this.set(STATES.CHARGING)}}releaseMain(){if(this.state===STATES.CHARGING){this.castT=0;this.set(STATES.CASTING);tone(650,.08)}}pressReel(){if(this.state===STATES.BITE){this.set(STATES.FIGHTING)}else if(this.state===STATES.FIGHTING)this.reeling=true}releaseReel(){this.reeling=false}
update(dt){this.elapsed+=dt;if(this.state===STATES.CHARGING){this.power+=this.powerDir*dt*72;if(this.power>=100){this.power=100;this.powerDir=-1}if(this.power<=18)this.powerDir=1}else if(this.state===STATES.CASTING){this.castT+=dt;let d=.28+.55*this.power/100,t=Math.min(1,this.castT/1.05);this.bobber.x=.5+(t-.5)*.08;this.bobber.y=.72-(Math.sin(t*Math.PI)*.38)+t*(.53-d*.16);if(t>=1)this.set(STATES.WAITING)}else if(this.state===STATES.WAITING){if(this.elapsed>=this.waitFor)this.set(STATES.BITE)}else if(this.state===STATES.BITE){this.biteWindow-=dt;this.bobber.splash=Math.max(0,this.bobber.splash-dt*.7);if(this.biteWindow<=0)this.fail("反應太慢，魚吃完餌逃走了") }else if(this.state===STATES.FIGHTING){let done=this.fighter.update(dt,this.reeling,this.tension),bad=this.tension.update(dt,this.reeling,this.fish.power,this.fighter.burst);if(bad)this.fail(bad==="broken"?"張力過高，魚線斷裂！":"張力歸零，魚脫鉤了！");else if(done)this.catchFish()}updateUI()}
catchFish(){this.set(STATES.CAUGHT);let length=Math.round(this.fish.min+Math.random()*(this.fish.max-this.fish.min)),weight=+(length*this.fish.kg*(.8+Math.random()*.4)).toFixed(2);this.catches++;this.record=Math.max(this.record,weight);$("#caughtCount").textContent=this.catches;$("#record").textContent=this.record.toFixed(2);showResult(true,`${this.fish.name}｜${length} 公分｜${weight} 公斤`,this.fish.emoji);tone(880,.12);setTimeout(()=>tone(1180,.2),130)}fail(reason){this.set(STATES.FAILED);showResult(false,reason,"💨")}}
const game=new GameStateMachine;
function mission(t){$("#mission").innerHTML=t.replace(/(黃綠區|快拉竿|蓄力)/g,"<strong>$1</strong>")}
function updateUI(){let s=game.state,fight=s===STATES.FIGHTING;$("#tensionUI").classList.toggle("active",fight);$("#power").classList.toggle("show",s===STATES.CHARGING);$("#powerFill").style.width=game.power+"%";$("#tensionFill").style.width=game.tension.value+"%";$("#needle").style.left=`calc(${game.tension.value}% - 2px)`;$("#tensionText").textContent=Math.round(game.tension.value)+"%";$("#staminaFill").style.width=(game.fighter.stamina||100)+"%";let m=$("#mainBtn"),r=$("#reelBtn");m.disabled=![STATES.READY,STATES.CHARGING].includes(s);m.textContent=s===STATES.CHARGING?"放開拋竿":"按住蓄力";r.disabled=![STATES.BITE,STATES.FIGHTING].includes(s);r.textContent=s===STATES.BITE?"立刻拉竿！":fight?"按住捲線":"捲線／拉竿";r.classList.toggle("pressed",game.reeling)}
function showResult(ok,info,emoji){$("#resultKicker").textContent=ok?"GREAT CATCH":"FISH ESCAPED";$("#resultTitle").textContent=ok?"成功釣起！":"魚逃走了";$("#resultInfo").textContent=info;$("#fishEmoji").textContent=emoji;setTimeout(()=>$("#result").classList.remove("hidden"),ok?1050:350)}function flash(t){$("#flashText").textContent=t;$("#flash").classList.add("show");setTimeout(()=>$("#flash").classList.remove("show"),650)}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0)}
function draw(now){let horizon=H*.34;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,"#59cfe9");sky.addColorStop(1,"#d7f5e9");ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle="#486e4e";for(let q=-60;q<W+80;q+=95){let h=45+(q*7%55);ctx.beginPath();ctx.moveTo(q,horizon);ctx.lineTo(q+55,horizon-h);ctx.lineTo(q+115,horizon);ctx.fill()}ctx.fillStyle="#ddd6ad";ctx.beginPath();ctx.moveTo(0,horizon);for(let q=0;q<=W;q+=80)ctx.lineTo(q,horizon-8-Math.sin(q*.021)*18);ctx.lineTo(W,horizon+22);ctx.lineTo(0,horizon+18);ctx.fill();let sea=ctx.createLinearGradient(0,horizon,0,H);sea.addColorStop(0,"#168dbe");sea.addColorStop(1,"#03476d");ctx.fillStyle=sea;ctx.fillRect(0,horizon,W,H-horizon);ctx.strokeStyle="#b9fbff33";ctx.lineWidth=1;for(let j=0;j<28;j++){let y=horizon+j*j*.55+8,amp=2+j*.12;ctx.beginPath();for(let q=0;q<W;q+=18){let yy=y+Math.sin(q*.022+now*.0018+j)*amp;q?ctx.lineTo(q,yy):ctx.moveTo(q,yy)}ctx.stroke()}drawBobber(now);drawRod(now)}
function drawBobber(now){if([STATES.READY,STATES.CHARGING].includes(game.state))return;let bx=game.bobber.x*W,by=game.bobber.y*H;if(game.state===STATES.WAITING)by+=Math.sin(now*.004)*3;if(game.state===STATES.BITE)by+=Math.sin(now*.035)*14;ctx.strokeStyle="#eafcffb8";ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(W*.61,H*.76);ctx.quadraticCurveTo(W*.58,H*.3,bx,by);ctx.stroke();if(game.bobber.splash>0||game.state===STATES.BITE){ctx.strokeStyle="#d9ffff";for(let i=0;i<4;i++){let r=10+i*10+Math.sin(now*.01+i)*5;ctx.beginPath();ctx.ellipse(bx,by+8,r,r*.28,0,0,7);ctx.stroke()}}ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(bx,by,5,15,0,0,7);ctx.fill();ctx.fillStyle="#ef433c";ctx.fillRect(bx-5,by-14,10,13)}
function drawRod(now){let fight=game.state===STATES.FIGHTING,bend=fight?(game.tension.value/100)*48:0;ctx.save();ctx.translate(W*.55,H*.88);ctx.rotate(-.22+(fight?Math.sin(now*.012)*.015:0));let g=ctx.createLinearGradient(0,0,220,-330);g.addColorStop(0,"#17191a");g.addColorStop(.55,"#49301e");g.addColorStop(1,"#161718");ctx.strokeStyle=g;ctx.lineWidth=15;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(0,50);ctx.quadraticCurveTo(80,-130,185-bend,-350);ctx.stroke();ctx.strokeStyle="#111";ctx.lineWidth=3;for(let i=0;i<5;i++){let t=i/5,px=50+t*110,py=-70-t*230;ctx.beginPath();ctx.arc(px-bend*t,py,12-t*5,0,7);ctx.stroke()}ctx.fillStyle="#202427";ctx.beginPath();ctx.ellipse(35,-15,48,35,-.2,0,7);ctx.fill();ctx.strokeStyle="#e0a329";ctx.lineWidth=7;ctx.beginPath();ctx.arc(35,-15,28,0,7);ctx.stroke();ctx.strokeStyle="#17191a";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(60,2);ctx.lineTo(100,35);ctx.lineTo(115,25);ctx.stroke();ctx.restore();if(fight&&game.fighter.burst){ctx.fillStyle="#d9ffff99";for(let i=0;i<12;i++){let a=i*.9+now*.01,r=20+(i%4)*8,px=W*.5+Math.cos(a)*r,py=H*.48+Math.sin(a)*r*.4;ctx.beginPath();ctx.arc(px,py,2+i%3,0,7);ctx.fill()}}if(game.state===STATES.CAUGHT){let t=Math.min(1,game.elapsed/1.05),fy=H*.62-Math.sin(t*Math.PI)*H*.42,fx=W*.5+Math.sin(t*5)*35;ctx.fillStyle=game.fish.color;ctx.save();ctx.translate(fx,fy);ctx.rotate(-.5+t);ctx.beginPath();ctx.ellipse(0,0,48,21,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-42,0);ctx.lineTo(-72,-28);ctx.lineTo(-67,0);ctx.lineTo(-72,28);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(28,-5,5,0,7);ctx.fill();ctx.restore()}}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(!$("#intro").classList.contains("hidden")||!$("#result").classList.contains("hidden")){}else game.update(dt);draw(now);requestAnimationFrame(loop)}
function tone(f=440,d=.06){try{audio||=new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function bindHold(el,down,up){el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);down()});["pointerup","pointercancel","pointerleave"].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();up()}))}bindHold($("#mainBtn"),()=>game.pressMain(),()=>game.releaseMain());bindHold($("#reelBtn"),()=>game.pressReel(),()=>game.releaseReel());addEventListener("keydown",e=>{if(e.repeat)return;if(e.code==="Space"){e.preventDefault();game.state===STATES.READY?game.pressMain():game.pressReel()}});addEventListener("keyup",e=>{if(e.code==="Space"){game.releaseMain();game.releaseReel()}});$("#startBtn").onclick=()=>{$("#intro").classList.add("hidden");game.set(STATES.READY);tone()};$("#againBtn").onclick=()=>{$("#result").classList.add("hidden");game.set(STATES.READY)};addEventListener("resize",resize);resize();updateUI();requestAnimationFrame(loop);
})();
</script></body></html>
