<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天才小釣手 - 上班偷閒時光</title>
<style>
:root{--gold:#ffd84a;--cyan:#53e7ff;--ink:#062239;--panel:#031b2dd9;--line:#ffffff30}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{margin:0;overflow:hidden;background:#052c48;color:#fff;font-family:"Microsoft JhengHei",system-ui,sans-serif;user-select:none}
button,a{font:inherit}
.game,canvas{width:100%;height:100%}
.game{position:relative;min-height:520px;overflow:hidden}
canvas{display:block;touch-action:none}
.top{position:absolute;z-index:8;inset:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;padding:10px;background:linear-gradient(#031a2bf2,transparent);pointer-events:none}
.back,.chip,.small-btn{pointer-events:auto;border:1px solid var(--line);border-radius:10px;background:#052b45d9;color:#fff;text-decoration:none;font-weight:900}
.back{padding:8px 11px}
.title{text-align:center;text-shadow:0 3px #087da2}
.title b{display:block;font-size:clamp(20px,3vw,32px);font-style:italic}
.title small{color:var(--gold);letter-spacing:3px}
.stats{justify-self:end;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:390px}
.chip{padding:7px 10px;font-size:12px}
.small-btn{padding:7px 10px;cursor:pointer}
.progress{position:absolute;z-index:7;top:58px;left:50%;transform:translateX(-50%);display:grid;gap:5px;width:min(590px,70vw);pointer-events:none}
.progress-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;text-shadow:0 2px #000}
.progress-bar{height:13px;border:1px solid #ffffff88;border-radius:99px;background:#031827d9;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#6cf09a,#ffe45b,#ff9248);transition:width .2s}
.tension-wrap{position:absolute;z-index:7;top:105px;left:50%;transform:translateX(-50%);width:min(540px,70vw);text-align:center;opacity:.5;transition:.2s;pointer-events:none}
.tension-wrap.active{opacity:1}
.tension-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;font-weight:900;text-shadow:0 2px #000}
.bar{position:relative;height:20px;padding:3px;border:2px solid white;border-radius:99px;background:#031a2bdd;box-shadow:0 3px 12px #0008}
.zones{position:absolute;inset:3px;border-radius:99px;background:linear-gradient(90deg,#e54b42 0 8%,#4ad46d 8% 58%,#f3d249 58% 82%,#eb4c43 82%)}
.fill{position:absolute;z-index:2;inset:3px auto 3px 3px;width:0;border-radius:99px;background:#fff9;box-shadow:0 0 8px white;transition:width .05s}
.needle{position:absolute;z-index:3;top:-5px;left:0;width:4px;height:27px;border-radius:3px;background:#fff;box-shadow:0 0 9px #fff}
.stamina{margin:6px auto 0;width:65%;height:9px;border:1px solid #fff8;border-radius:99px;background:#001827aa;overflow:hidden}
.stamina i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff6b54,#ffd34c);transition:width .1s}
.mission{position:absolute;z-index:7;top:148px;left:50%;transform:translateX(-50%);min-width:280px;max-width:min(620px,92vw);padding:9px 18px;border:1px solid #7fecff55;border-radius:99px;background:#031c2ed8;text-align:center;font-weight:900;text-shadow:0 2px #000;pointer-events:none}
.mission strong{color:var(--gold)}
.radar{position:absolute;z-index:8;right:14px;top:86px;width:148px;padding:9px;border:1px solid #79efff99;border-radius:16px;background:var(--panel);box-shadow:0 5px 18px #0008}
.radar-head{display:flex;justify-content:space-between;color:#bff7ff;font-size:10px;font-weight:900}
.radar-screen{position:relative;width:104px;height:104px;margin:7px auto 3px;border:1px solid #59e8ff;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#0d6a7044 0 2%,transparent 3%),repeating-radial-gradient(circle,transparent 0 22px,#52e8ed33 23px 24px),linear-gradient(90deg,transparent 49%,#52e8ed33 50%,transparent 51%),linear-gradient(transparent 49%,#52e8ed33 50%,transparent 51%),#032f3e}
.radar-sweep{position:absolute;left:50%;bottom:50%;width:50%;height:2px;transform-origin:left center;background:linear-gradient(90deg,#75fff5,transparent);animation:sweep 2.4s linear infinite}
.radar-aim{position:absolute;left:50%;bottom:50%;width:46%;height:2px;transform-origin:left center;background:#ffd945;box-shadow:0 0 5px #ffd945}
.radar-dot{position:absolute;width:7px;height:7px;margin:-3px;border-radius:50%;background:#71ff8d;box-shadow:0 0 8px #71ff8d}
.signal{text-align:center;color:#ffd945;font-size:11px;font-weight:900}
@keyframes sweep{to{transform:rotate(360deg)}}
.audio-panel{position:absolute;z-index:8;left:12px;top:58px;display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:#031b2dcc}
.audio-panel button{border:0;background:transparent;color:#fff;font-weight:900;cursor:pointer}
.audio-panel input{width:78px;accent-color:var(--cyan)}
.distance-hud{position:absolute;z-index:7;left:50%;bottom:102px;transform:translateX(-50%);display:none;min-width:210px;padding:8px 15px;border:1px solid #74efff99;border-radius:14px;background:#031b2de8;text-align:center;pointer-events:none}
.distance-hud.show{display:block}
.distance-hud b{display:block;color:#73eeff;font-size:18px}
.distance-hud span{font-size:12px;font-weight:900}
.distance-hud.near{border-color:#7dff91;box-shadow:0 0 18px #54ff7855}
.distance-hud.near b,.distance-hud.near span{color:#8dffa0}
.distance-hud.far span{color:#ffd45b}
.power{position:absolute;z-index:7;left:50%;bottom:104px;transform:translateX(-50%);width:min(420px,75vw);opacity:0;transition:.2s}
.power.show{opacity:1}
.power .bar{height:18px}
.power-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4ddc6a,#ffe14b,#f04d43)}
.controls{position:absolute;z-index:8;left:50%;bottom:18px;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(560px,92vw)}
.action{min-height:62px;border:2px solid white;border-radius:17px;background:linear-gradient(#ffe75d,#ff9a08);color:#432600;box-shadow:0 6px #9d4b00;font-size:19px;font-weight:1000;touch-action:none}
.action.secondary{background:linear-gradient(#55eaff,#078ac6);color:#04263b;box-shadow:0 6px #045a83}
.action:active,.action.pressed{transform:translateY(4px);box-shadow:0 2px #633000}
.action:disabled{filter:grayscale(.8);opacity:.55}
.dpad{position:absolute;z-index:9;left:14px;bottom:96px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:6px}
.dpad button{border:1px solid #ffffff88;border-radius:14px;background:#06253edb;color:#fff;font-size:22px;font-weight:1000;box-shadow:0 4px 12px #0008;touch-action:none}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .center{grid-column:2;grid-row:2;font-size:12px;color:#9ff4ff}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.modal{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:18px;background:#001625b8;backdrop-filter:blur(8px)}
.modal.hidden{display:none}
.card{width:min(590px,94vw);max-height:92vh;overflow:auto;padding:24px;border:2px solid var(--cyan);border-radius:22px;background:linear-gradient(145deg,#075376,#031c32);box-shadow:0 25px 80px #000a;text-align:center}
.card .kicker{color:var(--gold);font-weight:900;letter-spacing:4px}
.card h1{margin:7px;font-size:clamp(34px,7vw,62px);font-style:italic;text-shadow:0 4px #067da4}
.card p{color:#c6e9f1;line-height:1.7}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}
.rules div{padding:10px 5px;border-radius:10px;background:#fff1;font-size:12px}
.card button,.card a{display:grid;place-items:center;width:100%;min-height:50px;margin-top:9px;border:0;border-radius:12px;background:linear-gradient(#ffe85b,#ff9900);color:#422600;text-decoration:none;font-size:18px;font-weight:1000}
.card a{background:#096c94;color:#fff;border:1px solid #68ecff}
.catch-art{height:120px;margin:6px auto -4px}
.fish-card-art{width:82px;height:58px;margin:auto;display:block}
.catalog{position:absolute;z-index:19;inset:0;display:none;background:#03101de8;backdrop-filter:blur(8px);padding:16px}
.catalog.open{display:grid;grid-template-rows:auto auto 1fr;gap:10px}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.catalog-head h2{margin:0;font-size:28px;text-shadow:0 3px #075f82}
.catalog-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.catalog-tools select,.catalog-tools input{min-height:38px;border:1px solid #72edff66;border-radius:10px;background:#061f34;color:#fff;padding:0 10px}
.catalog-summary{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.place-pill{flex:0 0 auto;border:1px solid #ffffff33;border-radius:999px;padding:7px 10px;background:#082f4b;color:#d7f8ff;font-size:12px;font-weight:900}
.place-pill.locked{opacity:.45}
.fish-grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:2px 3px 14px}
.fish-tile{min-height:148px;border:1px solid #ffffff24;border-radius:12px;background:#f1ead1;color:#3a3a35;padding:8px;text-align:center;box-shadow:0 4px 10px #0005}
.fish-tile.r1{background:#9ee96b}.fish-tile.r2{background:#55c8dd}.fish-tile.r3{background:#e487df}.fish-tile.r4{background:#ffe36b}
.fish-tile.locked{filter:grayscale(1);opacity:.48}
.fish-tile b,.fish-tile span{display:block}
.fish-tile b{font-size:13px}.fish-tile small{font-weight:900;color:#666}
.flash{position:absolute;z-index:10;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;background:#fff2;transition:.15s}
.flash.show{opacity:1}
.flash b{font-size:clamp(34px,8vw,82px);font-style:italic;text-shadow:0 6px #006d92,0 0 25px #fff}
@media(max-width:650px){
  .top{padding:6px;grid-template-columns:auto 1fr auto}.back{padding:7px;font-size:11px}.title b{font-size:18px}.title small{display:none}.stats{max-width:118px}.stats .chip:nth-child(n+3){display:none}.small-btn{padding:6px 8px;font-size:11px}
  .progress{top:44px;width:62vw}.progress-row{font-size:10px}.tension-wrap{top:75px;width:86vw}.mission{top:122px;min-width:230px;padding:7px 10px;font-size:12px}.radar{right:6px;top:82px;width:104px;padding:5px}.radar-screen{width:72px;height:72px}.radar-head{font-size:8px}.signal{font-size:9px}
  .audio-panel{left:6px;top:42px;padding:4px 6px}.audio-panel button{font-size:10px}.audio-panel input{width:50px}
  .distance-hud{bottom:77px;min-width:190px;padding:5px 11px}.distance-hud b{font-size:15px}.distance-hud span{font-size:10px}
  .controls{bottom:12px;gap:8px}.action{min-height:53px;font-size:16px}.power{bottom:80px}.rules{grid-template-columns:1fr}.card{padding:18px}
  .dpad{left:8px;bottom:82px;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:5px}.dpad button{border-radius:12px;font-size:18px}
  .catalog{padding:10px}.catalog-head{align-items:flex-start}.catalog-head h2{font-size:22px}.catalog-tools input{width:130px}.fish-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fish-tile{min-height:138px;padding:7px}
}
</style>
</head>
<body>
<main class="game">
<canvas id="scene"></canvas>
<header class="top">
  <a class="back" href="index.html">← 返回大廳</a>
  <div class="title"><b>天才小釣手</b><small>MASTER ANGLER</small></div>
  <div class="stats">
    <span class="chip">分數 <b id="score">0</b></span>
    <span class="chip">時間 <b id="timeLeft">120</b></span>
    <span class="chip">圖鑑 <b id="caughtCount">0</b>/1000</span>
    <button class="small-btn" id="catalogBtn" type="button">魚類圖鑑</button>
  </div>
</header>
<section class="progress">
  <div class="progress-row"><span id="placeLabel">池塘</span><span id="unlockLabel">下一場所 50 分</span></div>
  <div class="progress-bar"><div class="progress-fill" id="placeProgress"></div></div>
</section>
<aside class="radar">
  <div class="radar-head"><span>魚群雷達</span><span>SONAR</span></div>
  <div class="radar-screen" id="radarScreen"><i class="radar-sweep"></i><i class="radar-aim" id="radarAim"></i></div>
  <div class="signal" id="signal">選擇落點</div>
</aside>
<div class="audio-panel"><button id="soundToggle" type="button">🔊 海浪音效</button><input id="volume" type="range" min="0" max="100" value="45" aria-label="音量"></div>
<audio id="oceanAudio" src="assets/audio/ocean-waves.mp3" loop preload="auto"></audio>
<audio id="reelAudio" src="assets/audio/fishing-reel.mp3" loop preload="auto"></audio>
<audio id="catchAudio" src="assets/audio/catch-success.mp3" preload="auto"></audio>
<section class="tension-wrap" id="tensionUI">
  <div class="tension-label"><span>魚線張力 TENSION</span><span id="tensionText">0%</span></div>
  <div class="bar"><div class="zones"></div><div class="fill" id="tensionFill"></div><div class="needle" id="needle"></div></div>
  <div class="stamina"><i id="staminaFill"></i></div>
</section>
<div class="mission" id="mission">用方向鍵移動落點，按住蓄力後放開拋竿</div>
<div class="power" id="power"><div class="bar"><div class="power-fill" id="powerFill"></div></div></div>
<div class="distance-hud" id="distanceHud" role="status"><b id="distanceText">魚距 0.0 m</b><span id="distanceHint">按住捲線讓魚靠近</span></div>
<div class="dpad" aria-label="落點方向控制">
  <button class="up" data-move="up" type="button">↑</button>
  <button class="left" data-move="left" type="button">←</button>
  <button class="center" data-move="center" type="button">落點</button>
  <button class="right" data-move="right" type="button">→</button>
  <button class="down" data-move="down" type="button">↓</button>
</div>
<div class="controls">
  <button class="action" id="mainBtn" type="button">按住蓄力</button>
  <button class="action secondary" id="reelBtn" type="button" disabled>捲線 / 拉竿</button>
</div>
<div class="flash" id="flash"><b id="flashText">魚上鉤！</b></div>
<section class="catalog" id="catalog">
  <div class="catalog-head">
    <h2>魚類圖鑑</h2>
    <div class="catalog-tools">
      <select id="catalogPlace"></select>
      <input id="catalogSearch" type="search" placeholder="搜尋魚名">
      <button class="small-btn" id="closeCatalog" type="button">關閉</button>
    </div>
  </div>
  <div class="catalog-summary" id="catalogSummary"></div>
  <div class="fish-grid" id="fishGrid"></div>
</section>
<section class="modal" id="intro">
  <div class="card">
    <div class="kicker">120 秒挑戰</div>
    <h1>天才小釣手</h1>
    <p>從池塘開始，每 50 分解鎖下一個場所。不同場所會出現不同魚種，釣到的魚會收錄到 1000 種魚類圖鑑。</p>
    <div class="rules"><div>方向鍵<br><b>自由移動落點</b></div><div>按住蓄力<br><b>控制距離</b></div><div>按住捲線<br><b>維持張力</b></div></div>
    <button id="startBtn" type="button">開始釣魚</button>
  </div>
</section>
<section class="modal hidden" id="result">
  <div class="card">
    <div class="kicker" id="resultKicker">GREAT CATCH</div>
    <canvas class="catch-art" id="resultFish" width="260" height="130"></canvas>
    <h1 id="resultTitle">釣到了！</h1>
    <p id="resultInfo"></p>
    <button id="againBtn" type="button">繼續釣魚</button>
    <a href="index.html">回到遊戲大廳</a>
  </div>
</section>
</main>

function tone(f=440,d=.06){if(!soundEnabled)return;try{audio||=new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function bindHold(el,down,up){el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);down()});["pointerup","pointercancel","pointerleave"].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();up()}))}
function bindMoveButton(btn){let dir=btn.dataset.move,step=.025,move=()=>{if(dir==="left")game.moveAim(-step,0);if(dir==="right")game.moveAim(step,0);if(dir==="up")game.moveAim(0,-step);if(dir==="down")game.moveAim(0,step);if(dir==="center"){game.aim={x:.58,y:.54};updateRadar()}};btn.addEventListener("pointerdown",e=>{e.preventDefault();move();clearInterval(moveTimer);moveTimer=setInterval(move,80)});["pointerup","pointercancel","pointerleave"].forEach(n=>btn.addEventListener(n,()=>clearInterval(moveTimer)))}
function initCatalog(){let sel=$("#catalogPlace");sel.innerHTML='<option value="all">全部場所</option>'+PLACES.map((p,i)=>`<option value="${i}">${p.name}</option>`).join("");$("#catalogSummary").innerHTML=PLACES.map((p,i)=>`<span class="place-pill ${game.score>=p.need?"":"locked"}">${p.name} ${SPECIES.filter(f=>f.place===i&&seen.has(f.id)).length}/${SPECIES.filter(f=>f.place===i).length}</span>`).join("")}
function renderCatalog(){let place=$("#catalogPlace").value||"all";initCatalog();$("#catalogPlace").value=place;let q=$("#catalogSearch").value.trim();let items=SPECIES.filter(f=>(place==="all"||String(f.place)===place)&&(!q||f.name.includes(q))).slice(0,1000);let grid=$("#fishGrid");grid.innerHTML="";items.forEach(f=>{let tile=document.createElement("article"),known=seen.has(f.id);tile.className=`fish-tile r${f.rarity} ${known?"":"locked"}`;let art=document.createElement("canvas");art.className="fish-card-art";art.width=164;art.height=116;tile.appendChild(art);drawFishIcon(art.getContext("2d"),82,58,.82,f,0,!known);tile.insertAdjacentHTML("beforeend",`<b>${known?f.name:"???"}</b><small>${PLACES[f.place].name}｜${RARITY[f.rarity]}</small><span>${known?`${f.min}-${f.max} cm`:"尚未釣獲"}</span>`);grid.appendChild(tile)});catalogDirty=false}
canvas.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||e.buttons)game.setAim(e.clientX,e.clientY)});
canvas.addEventListener("pointerdown",e=>game.setAim(e.clientX,e.clientY));
bindHold($("#mainBtn"),()=>game.pressMain(),()=>game.releaseMain());
bindHold($("#reelBtn"),()=>game.pressReel(),()=>game.releaseReel());
$$(".dpad button").forEach(bindMoveButton);
addEventListener("keydown",e=>{if(e.repeat)return;if(e.code==="Space"){e.preventDefault();game.state===STATES.READY?game.pressMain():game.pressReel()}if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code)){e.preventDefault();game.moveAim(e.code==="ArrowLeft"?-.035:e.code==="ArrowRight"?.035:0,e.code==="ArrowUp"?-.035:e.code==="ArrowDown"?.035:0)}});
addEventListener("keyup",e=>{if(e.code==="Space"){game.releaseMain();game.releaseReel()}});
$("#soundToggle").onclick=toggleSound;$("#volume").oninput=applyVolume;
$("#startBtn").onclick=()=>{$("#intro").classList.add("hidden");game.set(STATES.READY);applyVolume();startAmbient();tone()};
$("#againBtn").onclick=()=>{$("#result").classList.add("hidden");if(game.state===STATES.ENDED){game.timeLeft=120;game.score=0;game.placeIndex=0;game.resetZones();initRadar()}game.set(STATES.READY);startAmbient()};
$("#catalogBtn").onclick=()=>{$("#catalog").classList.add("open");renderCatalog()};
$("#closeCatalog").onclick=()=>$("#catalog").classList.remove("open");
$("#catalogPlace").onchange=renderCatalog;$("#catalogSearch").oninput=renderCatalog;
document.addEventListener("visibilitychange",()=>{if(document.hidden){oceanAudio.pause();stopReelSound()}else if(soundEnabled&&$("#intro").classList.contains("hidden"))startAmbient()});
addEventListener("resize",resize);
resize();applyVolume();initRadar();initCatalog();updateUI();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
