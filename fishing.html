<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>深海釣手｜遊戲室 Online</title>
<style>
:root{--gold:#ffd83d;--deep:#03233d;--panel:rgba(2,30,52,.88)}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:#043a60;color:#fff;font-family:"Microsoft JhengHei",system-ui,sans-serif;user-select:none}button{font:inherit;color:inherit;cursor:pointer}.game,canvas{width:100%;height:100%}.game{position:relative;min-height:500px;overflow:hidden}canvas{display:block;touch-action:none}.top{position:absolute;z-index:5;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px;background:linear-gradient(#031f36ef,transparent);pointer-events:none}.top a,.top button{pointer-events:auto;border:1px solid #ffffff55;border-radius:11px;background:#042b49c9;padding:9px 13px;color:#fff;text-decoration:none;font-weight:900}.top button{justify-self:end}.logo{text-align:center;text-shadow:0 3px #05759d}.logo b{display:block;font-size:clamp(21px,3vw,34px);font-style:italic}.logo small{color:var(--gold);letter-spacing:3px}.hud{position:absolute;z-index:4;top:78px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.meter{min-width:155px;padding:8px 14px;border:2px solid #ffffff88;border-radius:999px;background:linear-gradient(#073f65,#021e35);text-align:center;font-weight:800}.meter b{margin-left:5px;color:var(--gold);font-size:22px}.panel{position:absolute;z-index:5;left:15px;top:133px;width:165px;padding:11px;border:1px solid #8dedff66;border-radius:17px;background:var(--panel);box-shadow:0 10px 28px #0007}.panel h2{margin:0 0 8px;color:#8df6ff;font-size:15px}.rods{display:grid;gap:6px}.rod{display:grid;grid-template-columns:31px 1fr;align-items:center;gap:6px;min-height:44px;padding:5px;border:1px solid #fff2;border-radius:9px;background:#053b5ec4;text-align:left}.rod i{width:28px;height:5px;border-radius:3px;transform:rotate(-25deg)}.rod b,.rod small{display:block}.rod b{font-size:13px}.rod small{font-size:9px;color:#b7dce5}.rod.active{outline:2px solid var(--gold);background:#087b96e8}.rod.locked{filter:grayscale(.7);opacity:.55}.catch{position:absolute;z-index:5;right:15px;top:135px;width:178px;min-height:100px;display:grid;place-items:center;padding:10px;border:1px solid #fff4;border-radius:17px;background:var(--panel);text-align:center}.catch .emoji{font-size:36px}.catch b,.catch small{display:block}.catch b{color:var(--gold)}.catch small{color:#b8dfe8}.catch.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.1);box-shadow:0 0 30px #44eeff}}.controls{position:absolute;z-index:6;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}.cast{min-width:215px;min-height:56px;border:2px solid white;border-radius:999px;background:linear-gradient(#ffef55,#ff9b0a);color:#422500;box-shadow:0 7px #a94e00;font-size:20px;font-weight:1000}.cast:active{transform:translateY(5px);box-shadow:0 2px #a94e00}.tip{padding:8px 12px;border-radius:99px;background:#021e35bf;color:#c6ebf1;font-size:12px}.toast{position:absolute;z-index:8;top:30%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:11px 23px;border:2px solid #5ff3ff;border-radius:99px;background:#021d31e8;font-size:23px;font-weight:1000;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:16px;background:#001729b9;backdrop-filter:blur(8px)}.overlay.hidden{display:none}.dialog{width:min(550px,94vw);padding:27px;border:2px solid #69efff;border-radius:23px;background:linear-gradient(145deg,#074260,#031b31);box-shadow:0 25px 80px #000a;text-align:center}.dialog .kicker{color:var(--gold);font-weight:900;letter-spacing:4px}.dialog h1{margin:6px;font-size:clamp(38px,7vw,68px);font-style:italic;text-shadow:0 4px #05759d}.dialog p{color:#c5e9ef;line-height:1.65}.dialog button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(#ffe85b,#ff9900);color:#3d2300;font-size:20px;font-weight:1000}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.legend div{padding:8px 4px;border-radius:9px;background:#fff1;font-size:12px}.legend b{display:block;color:var(--gold);font-size:17px}@media(max-width:700px){.top{padding:7px}.top a,.top button{padding:7px;font-size:11px}.logo b{font-size:18px}.logo small{display:none}.hud{top:58px;width:100%;justify-content:center}.meter{min-width:125px;padding:5px 7px;font-size:12px}.meter b{font-size:18px}.panel{left:6px;top:100px;width:118px;padding:6px}.panel h2{font-size:11px}.rod{grid-template-columns:20px 1fr;min-height:34px;padding:3px}.rod i{width:20px}.rod b{font-size:10px}.rod small{font-size:7px}.catch{right:6px;top:100px;width:112px;min-height:72px;padding:5px}.catch .emoji{font-size:25px}.catch b{font-size:12px}.catch small{font-size:9px}.tip{display:none}.controls{bottom:12px}.cast{min-width:175px;min-height:47px;font-size:16px}}
.end-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog .end-actions a{display:grid;place-items:center;width:100%;padding:14px;border:1px solid #68efff;border-radius:13px;background:#075279;color:#fff;font-size:20px;font-weight:1000;text-decoration:none}@media(max-width:480px){.end-actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="game"><canvas id="c" aria-label="2D 深海釣魚遊戲"></canvas>
<header class="top"><a href="index.html">← 返回大廳</a><div class="logo"><b>深海釣手</b><small>OCEAN ANGLER</small></div><button id="sound">音效：開</button></header>
<section class="hud"><div class="meter">剩餘時間 <b id="time">90</b> 秒</div><div class="meter">目前得分 <b id="score">0</b> 分</div></section>
<aside class="panel"><h2>選擇釣竿</h2><div class="rods" id="rods"></div></aside>
<aside class="catch" id="catch"><div><div class="emoji">🐟</div><b id="catchName">等待出竿</b><small id="catchInfo">空白鍵或按鈕拋鉤</small></div></aside>
<div class="controls"><span class="tip">魚鉤會在 90° 範圍自動擺動</span><button class="cast" id="cast">按空白鍵・拋竿</button></div><div class="toast" id="toast"></div>
<section class="overlay" id="start"><div class="dialog"><div class="kicker">90 秒限時挑戰</div><h1>深海釣手</h1><p>看準魚鉤角度，按下空白鍵拋竿。累積分數可解鎖高級釣竿；綠桿只能釣一般小魚。</p><div class="legend"><div>🐟 小魚<b>+10</b>快速收線</div><div>🐋 大魚<b>+30</b>緩慢收線</div><div>🥾 垃圾<b>+0</b>較慢收線</div></div><button id="startBtn">開始釣魚</button></div></section>
<section class="overlay hidden" id="end"><div class="dialog"><div class="kicker">TIME UP</div><h1>遊戲結束！</h1><p>最終得分：<b id="finalScore">0</b> 分<br>共釣起 <b id="finalCount">0</b> 個目標</p><div class="end-actions"><button id="restart">再玩一次</button><a href="index.html">回到大廳</a></div></div></section>
</main><script>
(()=>{"use strict";
const $=s=>document.querySelector(s),c=$("#c"),x=c.getContext("2d"),timeEl=$("#time"),scoreEl=$("#score"),rodsEl=$("#rods"),toast=$("#toast");
// 釣竿分級：unlock 為單局解鎖分數，max 限制可捕捉的魚體型。
const R=[{n:"綠桿",c:"#31df6e",unlock:0,max:0,out:430,back:330},{n:"藍桿",c:"#2da9ff",unlock:40,max:1,out:455,back:350},{n:"紅桿",c:"#ff4c51",unlock:90,max:2,out:480,back:375},{n:"銀桿",c:"#d8edf8",unlock:160,max:2,out:515,back:405},{n:"金桿",c:"#ffd32d",unlock:240,max:2,out:555,back:445}];
// 魚種參考使用者提供的海釣圖鑑；z=0/1/2 為小/中/大魚。
const TYPES=[{n:"鯖魚",z:0,p:10,v:120,col:["#8adce1","#257c99"]},{n:"秋刀魚",z:0,p:10,v:136,col:["#c0e0df","#547c85"]},{n:"柳葉魚",z:0,p:10,v:128,col:["#d8dba9","#6d775d"]},{n:"石斑魚",z:1,p:10,v:87,col:["#d88b4e","#713d35"]},{n:"河豚",z:1,p:10,v:78,col:["#dfc47c","#705b48"]},{n:"鮭魚",z:1,p:10,v:92,col:["#ee9279","#9e4c58"]},{n:"鮪魚",z:2,p:30,v:53,col:["#4e829d","#162f4c"]},{n:"旗魚",z:2,p:30,v:60,col:["#4c9ec8","#17325b"]},{n:"鰤魚",z:2,p:30,v:57,col:["#b0aa76","#515a55"]},{n:"鱈魚",z:2,p:30,v:49,col:["#abb89f","#465963"]}];
const S={run:false,score:0,count:0,left:90,rod:0,fish:[],trash:[],bubbles:[],parts:[],last:0,sec:0,sound:true,hook:{mode:"swing",a:0,dir:1,len:62,item:null}};
let W,H,D=1,water=150,ox=0,oy=0,audio=null,timer=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(D,0,0,D,0,0);water=Math.max(130,Math.min(185,H*.25));ox=W*.5+8;oy=water-20;S.fish.forEach(f=>f.y=Math.max(water+60,Math.min(H-65,f.y)))}
function rods(){rodsEl.innerHTML="";R.forEach((r,i)=>{let b=document.createElement("button");b.className="rod";b.innerHTML=`<i style="background:${r.c}"></i><span><b>${r.n}</b><small>${r.unlock?r.unlock+" 分解鎖":"初階・小魚"}</small></span>`;b.onclick=()=>selectRod(i);rodsEl.append(b)});updateRods()}
function updateRods(){[...rodsEl.children].forEach((b,i)=>{let lock=S.score<R[i].unlock;b.classList.toggle("locked",lock);b.classList.toggle("active",i===S.rod);b.querySelector("small").textContent=lock?R[i].unlock+" 分解鎖":i?"已解鎖":"初階・小魚"})}
function selectRod(i){if(S.score<R[i].unlock){say(`還差 ${R[i].unlock-S.score} 分解鎖${R[i].n}`);tone(140,.08,"sawtooth");return}if(S.hook.mode!=="swing"){say("收線後才能換竿");return}S.rod=i;updateRods();tone(500+i*80,.06)}
function spawnFish(initial=false,forcedSize=null){let size=forcedSize??(Math.random()*3|0),pool=TYPES.filter(f=>f.z===size),t=pool[Math.random()*pool.length|0],dir=Math.random()<.5?-1:1,s=[.72,.96,1.28][t.z];S.fish.push({...t,s,dir,x:initial?Math.random()*W:dir>0?-90:W+90,y:water+70+Math.random()*Math.max(60,H-water-155),phase:Math.random()*7,caught:false})}
function spawnTrash(){S.trash.push({n:"破靴子",x:60+Math.random()*(W-120),y:H-46,w:46,h:28,caught:false})}
function reset(){Object.assign(S,{score:0,count:0,left:90,rod:0,fish:[],trash:[],bubbles:[],parts:[],sec:0,hook:{mode:"swing",a:0,dir:1,len:62,item:null}});scoreEl.textContent=0;timeEl.textContent=90;let fishCount=Math.max(15,Math.round(W/85));for(let i=0;i<fishCount;i++)spawnFish(true,i%3);for(let i=0;i<Math.max(3,Math.round(W/330));i++)spawnTrash();for(let i=0;i<28;i++)S.bubbles.push({x:Math.random()*W,y:water+Math.random()*(H-water),r:1+Math.random()*4,v:8+Math.random()*18});updateRods();caught("🐟","等待出竿","空白鍵或按鈕拋鉤")}
function start(){reset();S.run=true;S.last=performance.now();$("#start").classList.add("hidden");$("#end").classList.add("hidden");tone(440,.08);requestAnimationFrame(loop)}
function finish(){S.run=false;$("#finalScore").textContent=S.score;$("#finalCount").textContent=S.count;$("#end").classList.remove("hidden");tone(300,.15);setTimeout(()=>tone(220,.25),140)}
function cast(){if(S.run&&S.hook.mode==="swing"){S.hook.mode="out";S.hook.item=null;tone(680,.05,"square")}}
function pos(){return{x:ox+Math.sin(S.hook.a)*S.hook.len,y:oy+Math.cos(S.hook.a)*S.hook.len}}
function update(dt){S.sec+=dt;while(S.sec>=1){S.sec--;S.left--;timeEl.textContent=Math.max(0,S.left);if(S.left<=0){finish();return}}S.bubbles.forEach(b=>{b.y-=b.v*dt;if(b.y<water){b.y=H;b.x=Math.random()*W}});S.fish.forEach(f=>{if(!f.caught){f.x+=f.v*f.dir*dt;f.phase+=dt*2.2;if(f.x>W+100||f.x<-100){f.dir*=-1;f.x=f.dir>0?-80:W+80;f.y=water+70+Math.random()*Math.max(60,H-water-150)}}});S.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});S.parts=S.parts.filter(p=>p.life>0);let h=S.hook,r=R[S.rod];if(h.mode==="swing"){h.a+=h.dir*dt*1.02;if(h.a>Math.PI/4){h.a=Math.PI/4;h.dir=-1}if(h.a<-Math.PI/4){h.a=-Math.PI/4;h.dir=1}h.len=62}else if(h.mode==="out"){h.len+=r.out*dt;let p=pos(),hit=S.fish.find(f=>!f.caught&&f.z<=r.max&&Math.abs(p.x-f.x)<38*f.s&&Math.abs(p.y-f.y)<18*f.s);if(!hit)hit=S.trash.find(t=>!t.caught&&Math.abs(p.x-t.x)<30&&Math.abs(p.y-t.y)<27);if(hit)grab(hit);else if(p.x<12||p.x>W-12||p.y>H-16)h.mode="back"}else{let speed=r.back;if(h.item?.z===2)speed*=.37;else if(h.item&&!Number.isInteger(h.item.z))speed*=.35;else if(h.item?.z===1)speed*=.68;h.len-=speed*dt;if(h.len<=62)retract()}if(h.item){let p=pos();h.item.x=p.x;h.item.y=p.y+13}}
function grab(item){item.caught=true;S.hook.item=item;S.hook.mode="back";let trash=!Number.isInteger(item.z);caught(trash?"🥾":item.z===2?"🐋":"🐟",item.n,trash?"釣到垃圾，收線較慢":item.p+" 分・正在收線");tone(trash?120:760,.1,trash?"sawtooth":"sine")}
function retract(){let item=S.hook.item;S.hook.len=62;S.hook.mode="swing";S.hook.item=null;if(!item)return;let isFish=Number.isInteger(item.z),list=isFish?S.fish:S.trash,i=list.indexOf(item);if(i>=0)list.splice(i,1);S.count++;if(isFish){let before=S.score;S.score+=item.p;scoreEl.textContent=S.score;burst(ox,oy);say(`${item.n} +${item.p} 分`);tone(920,.08);R.forEach(r=>{if(before<r.unlock&&S.score>=r.unlock)say(`解鎖 ${r.n}！`)});updateRods();spawnFish()}else{say("釣到破靴子，0 分");spawnTrash()}}
function burst(px,py){for(let i=0;i<18;i++)S.parts.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:-30-Math.random()*140,life:.5+Math.random()*.5})}
function caught(icon,name,info){$(".emoji").textContent=icon;$("#catchName").textContent=name;$("#catchInfo").textContent=info;let el=$("#catch");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function say(t){toast.textContent=t;toast.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove("show"),1200)}
function draw(){x.clearRect(0,0,W,H);sky();ocean();bed();S.bubbles.forEach(b=>{x.strokeStyle="#ddffff66";x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke()});S.fish.forEach(drawFish);S.trash.forEach(drawBoot);boat();line();S.parts.forEach(p=>{x.globalAlpha=p.life;x.fillStyle="#ffe45b";x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});x.globalAlpha=1}
function sky(){let g=x.createLinearGradient(0,0,0,water);g.addColorStop(0,"#62e5f4");g.addColorStop(1,"#d8faed");x.fillStyle=g;x.fillRect(0,0,W,water);x.fillStyle="#fff9";for(let i=0;i<5;i++){x.beginPath();x.ellipse((i*251+70)%W,40+(i%2)*30,65,16,0,0,7);x.fill()}x.fillStyle="#176b5dba";for(let q=0;q<W;q+=48){let h=30+(q*13%55);x.beginPath();x.moveTo(q,water);x.lineTo(q+23,water-h);x.lineTo(q+46,water);x.fill()}}
function ocean(){let g=x.createLinearGradient(0,water,0,H);g.addColorStop(0,"#079dc6");g.addColorStop(.4,"#056489");g.addColorStop(1,"#032640");x.fillStyle=g;x.fillRect(0,water,W,H-water);x.strokeStyle="#a5faff88";x.lineWidth=2;for(let j=0;j<5;j++){x.beginPath();for(let q=0;q<=W;q+=12){let y=water+j*9+Math.sin(q*.035+j)*3;q?x.lineTo(q,y):x.moveTo(q,y)}x.stroke()}x.fillStyle="#74edff0d";for(let q=30;q<W;q+=170){x.beginPath();x.moveTo(q,water);x.lineTo(q+90,H);x.lineTo(q+165,H);x.lineTo(q+55,water);x.fill()}}
function bed(){x.fillStyle="#8c8050";x.beginPath();x.moveTo(0,H-30);for(let q=0;q<=W;q+=45)x.lineTo(q,H-32-Math.sin(q*.04)*7);x.lineTo(W,H);x.lineTo(0,H);x.fill();for(let q=20;q<W;q+=115){x.strokeStyle=q%2?"#3a9668":"#53b47a";x.lineWidth=4;x.beginPath();x.moveTo(q,H-25);x.quadraticCurveTo(q-16,H-70,q+4,H-105);x.stroke()}}
function drawFish(f){let y=f.y+Math.sin(f.phase)*5;x.save();x.translate(f.x,y);x.scale(f.dir*f.s,f.s);let g=x.createLinearGradient(-35,-15,35,15);g.addColorStop(0,f.col[1]);g.addColorStop(.55,f.col[0]);g.addColorStop(1,f.col[1]);x.fillStyle=g;x.beginPath();x.ellipse(0,0,37,19,0,0,7);x.fill();x.beginPath();x.moveTo(-31,0);x.lineTo(-57,-22);x.lineTo(-51,0);x.lineTo(-57,22);x.fill();x.fillStyle=f.col[1];x.beginPath();x.moveTo(-4,-14);x.lineTo(9,-29);x.lineTo(18,-14);x.fill();if(f.n==="旗魚"){x.beginPath();x.moveTo(31,-4);x.lineTo(65,0);x.lineTo(31,4);x.fill()}x.fillStyle="white";x.beginPath();x.arc(23,-5,4.5,0,7);x.fill();x.fillStyle="#10232f";x.beginPath();x.arc(25,-5,2.2,0,7);x.fill();x.restore()}
function drawBoot(t){x.save();x.translate(t.x,t.y);x.rotate(-.12);x.fillStyle="#4b3428";x.strokeStyle="#211918";x.lineWidth=4;x.beginPath();x.moveTo(-18,-24);x.lineTo(7,-24);x.lineTo(8,2);x.quadraticCurveTo(25,5,29,14);x.quadraticCurveTo(5,22,-30,12);x.lineTo(-17,2);x.closePath();x.fill();x.stroke();x.restore()}
function boat(){x.save();x.translate(W*.5,water-12);x.fillStyle="#7b3e24";x.strokeStyle="#3d2119";x.lineWidth=4;x.beginPath();x.moveTo(-74,-18);x.lineTo(78,-18);x.lineTo(52,18);x.lineTo(-48,18);x.closePath();x.fill();x.stroke();x.fillStyle="#f7eee0";x.fillRect(-34,-55,61,37);x.fillStyle="#65daf1";x.fillRect(-25,-48,18,19);x.fillRect(2,-48,18,19);x.fillStyle="#ef473e";x.fillRect(-43,-62,80,9);x.strokeStyle=R[S.rod].c;x.lineWidth=6;x.lineCap="round";x.beginPath();x.moveTo(26,-32);x.lineTo(82,-83);x.stroke();x.fillStyle="#17272c";x.beginPath();x.arc(25,-36,11,0,7);x.fill();x.fillStyle="#e3ad7e";x.beginPath();x.arc(25,-52,8,0,7);x.fill();x.restore()}
function line(){let p=pos();x.strokeStyle="#f5fcffdf";x.lineWidth=1.5;x.beginPath();x.moveTo(ox,oy);x.lineTo(p.x,p.y);x.stroke();x.save();x.translate(p.x,p.y);x.rotate(-S.hook.a);x.strokeStyle="#eefcff";x.lineWidth=3;x.beginPath();x.moveTo(0,-8);x.lineTo(0,8);x.arc(-7,8,7,0,2.75);x.stroke();x.restore()}
function loop(now){if(!S.run){draw();return}let dt=Math.min(.033,(now-S.last)/1000||0);S.last=now;update(dt);draw();if(S.run)requestAnimationFrame(loop)}
function tone(f=440,d=.06,type="sine"){if(!S.sound)return;try{audio||=new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
$("#startBtn").onclick=start;$("#restart").onclick=start;$("#cast").onclick=cast;c.onpointerdown=cast;addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();cast()}});$("#sound").onclick=e=>{S.sound=!S.sound;e.currentTarget.textContent="音效："+(S.sound?"開":"關");tone()};addEventListener("resize",resize);resize();rods();reset();draw();
})();
</script></body></html>
